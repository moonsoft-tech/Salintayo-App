workflows:
  salintayo-ios-workflow:
    name: Salintayo iOS Workflow (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - salintayo_secrets
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: NewUpdate3
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web bundle
        script: |
          npm run build
      - name: Add and sync Capacitor iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager SPM
          fi
          npx cap sync ios
      - name: Add Firebase GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist"
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath("App", true)
            file_ref = group.files.find { |f| f.path == "GoogleService-Info.plist" }
            unless file_ref
              file_ref = group.new_reference("GoogleService-Info.plist")
              target.resources_build_phase.add_file_reference(file_ref)
              project.save
              puts "GoogleService-Info.plist added to Xcode project and Copy Bundle Resources."
            else
              puts "GoogleService-Info.plist already referenced in Xcode project."
            end
          '
      - name: Build unsigned iOS simulator app
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - moonsoft2.0@gmail.com
        notify:
          success: true
          failure: true
  salintayo-ios-device-workflow:
    name: Salintayo iOS Device Workflow (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - salintayo_secrets
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: NewUpdate3
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web bundle
        script: |
          npm run build
      - name: Add and sync Capacitor iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager SPM
          fi
          npx cap sync ios
      - name: Add Firebase GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist"
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath("App", true)
            file_ref = group.files.find { |f| f.path == "GoogleService-Info.plist" }
            unless file_ref
              file_ref = group.new_reference("GoogleService-Info.plist")
              target.resources_build_phase.add_file_reference(file_ref)
              project.save
              puts "GoogleService-Info.plist added to Xcode project and Copy Bundle Resources."
            else
              puts "GoogleService-Info.plist already referenced in Xcode project."
            end
          '
      - name: Build unsigned iOS device app
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - moonsoft2.0@gmail.com
        notify:
          success: true
          failure: true